<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel | Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cormorant Garamond', 'Georgia', 'serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    },
                    aspectRatio: {
                        '3/4': '3 / 4',
                    },
                    colors: {
                        background: '#FAF9F6', /* 暖米色 */
                        foreground: '#2D2A26', /* 深褐灰 */
                        primary: '#8C7878',    /* 核心藕荷棕 */
                        secondary: '#EBE7D9',  /* 浅米色装饰 */
                        border: '#E6E4E0',
                        card: '#FFFFFF',
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -10px rgba(140, 120, 120, 0.05)',
                        'float': '0 25px 50px -12px rgba(140, 120, 120, 0.2)',
                        'hero-frame': '0 20px 60px -10px rgba(140, 120, 120, 0.3), 0 10px 20px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-foreground antialiased selection:bg-primary/20 overflow-x-hidden">

    <nav id="navbar-root" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500"></nav>

    <main class="min-h-screen">
        
        <section id="hero-root" class="min-h-screen flex items-center justify-center pt-20 px-6 relative">
            <div class="max-w-7xl w-full grid lg:grid-cols-2 gap-16 items-center">
                <div id="hero-static-content" class="order-2 lg:order-1"></div>
                
                <div id="hero-gallery-wrapper" class="relative order-1 lg:order-2 aspect-[3/4] w-full max-w-md mx-auto rounded-2xl overflow-hidden shadow-hero-frame border border-primary/10 bg-secondary/20">
                    </div>
            </div>
        </section>

        <section id="projects-root" class="py-32 px-6"></section>

        <section id="research-root" class="py-32 px-6"></section>

        <section id="products-root" class="py-32 px-6"></section>

        <section id="philosophy-root" class="py-32 px-6"></section>

        <section id="awards-root" class="py-32 px-6"></section>

        <section id="contact-root" class="py-32 px-6"></section>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
